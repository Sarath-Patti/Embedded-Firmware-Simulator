name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]

    steps:
      # Step 1: Checkout the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure CMake build system with warnings as errors enabled for CI
      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DEFS_ENABLE_WERROR=ON

      # Step 3: Build static library, all example demo binaries, and unit tests
      - name: Build static library, demos, and tests
        run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.build_type }}

      # Step 4: Run CTest unit test suite with detailed output on failure
      - name: Run CTest test suite
        run: ctest --test-dir ${{ github.workspace }}/build -C ${{ matrix.build_type }} --output-on-failure
